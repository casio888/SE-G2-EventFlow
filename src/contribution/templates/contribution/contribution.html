{% extends "base_topside.html" %}
{% load static %}

{% block content %}
<main>
    <section name="search">
        <input type="text" value="Name" id="name"> 
        <button id="looking_for">Suchen</button>
    </section>

    <section name="table">
    
        <table id="table" >
            <!--Tabelle wird automatisch gefüllt. Wenn dann muss nur der Kopf vorhanden sein.-->
            <!-- |Marker | Name | Zeit | Ort | Kathegorien als Kopf-->
            <thead>
                <tr>
                    <th data-column="title">Titel</th>
                    <th data-column="starttime">Beginn</th>
                    <th data-column="location">Ort</th>
                    <th data-column="apply"></th>
                    <!--<th data-column="Kategorien">Kategorien</th>-->
                </tr>
            </thead>
            <tbody id="tableBody">
                {% for event in events %}
                <tr>
                    <td>{{event.title}}</td>
                    <td>{{event.start_datum}}</td>
                    <td>{{event.ort}}</td>
                    <td><a href="{% url 'event_application' event_id=event.pk %}" class="btn btn-secondary">
                        <button>Bewerden</button>
                    </a></td>
                </tr>
                    {%empty%}
                <tr>
                    <td colspan="5">Keine Events gefunden</td>
                </tr>
                {%endfor%}
            </tbody>
        </table>
    </section>
</main>
{% endblock %}
