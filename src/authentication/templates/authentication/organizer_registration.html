{% extends "base_topside.html" %}
{% load static %}

{% block extra_head %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{% static 'css/nav.css' %}">
<link rel="stylesheet" href="{% static 'authentication/css/registration.css' %}">
{% endblock %}

{% block content %}
<div class="registration-wrapper">
    
    <div class="registration-card p-5 bg-white">
        
        <h1 id="registerLabel" class="fw-bold text-center registration-title">Veranstalter Registrierung</h1>
        
        <form method="POST" action="{% url 'authentication:OrganizerRegistration' %}" class="django-form-fields text-start">
            {% csrf_token %}
            
            <div class="form-input-fields mb-4">
                {{ form.as_p }}
            </div>
            
            <div class="d-flex justify-content-between align-items-center w-100 mt-5">

                <div>                
                    <a href="{% url 'authentication:ContributerRegistration' %}" class="text-decoration-none small fw-bold" style="color: #436cf4;">
                    &lt; Willst du dich als Einreicher Registrieren?
                    </a>
                </div>

                <a href="{% url 'base:login' %}" class="text-decoration-none small fw-bold" style="color: #436cf4;">
                   &lt; zurück
                </a>

                <button type="submit" id="submittButton" class="btn btn-primary btn-registration-submit px-5 py-2.5 fw-semibold">
                    weiter
                </button>
                
            </div>

        </form>
        
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
